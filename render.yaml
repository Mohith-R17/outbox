databases:
  - name: reachinbox-db
    plan: free
    region: ohio
    databaseName: reachinbox
    user: reachinbox_user

services:
  # Redis / Key Value Store
  - type: keyvalue
    name: reachinbox-redis
    plan: free
    region: ohio
    ipAllowList: []

  # Backend Web Service
  - type: web
    name: reachinbox-api
    runtime: node
    plan: free
    region: ohio
    buildCommand: "cd backend && npm install && npm run build && npx prisma generate && npx prisma migrate deploy"
    startCommand: "cd backend && npm run start"
    healthCheckPath: "/api/health"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: ELASTICSEARCH_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "https://reachinbox-frontend.onrender.com"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: "https://reachinbox-api.onrender.com/api/auth/google/callback"
      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_CALLBACK_URL
        value: "https://reachinbox-api.onrender.com/api/slack/callback"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_EMAIL_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "100"

  # BullMQ Worker Service
  - type: worker
    name: reachinbox-worker
    runtime: node
    plan: free
    region: ohio
    buildCommand: "cd backend && npm install && npm run build && npx prisma generate"
    startCommand: "cd backend && npm run worker"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: reachinbox-redis
          property: connectionString
      - key: ELASTICSEARCH_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_EMAIL_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "100"

  # React Frontend
  - type: web
    name: reachinbox-frontend
    runtime: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "frontend/dist"
    envVars:
      - key: VITE_BACKEND_URL
        value: "https://reachinbox-api.onrender.com/api"
